# Copy to gateway.yaml and replace the example tokens.
# Relative paths are resolved from this file's directory.
listen: "127.0.0.1:8080"
admin_listen: "127.0.0.1:9090"
data_dir: "./data"
public_url: "http://127.0.0.1:8080"
admin_token: "replace-with-admin-secret"
# Consumer tokens are configured dynamically in POST /admin/v1/routes.

# Route interfaces use credential_ref to select a key from this map.
# Values are Bearer tokens without the "Bearer " prefix; no env expansion.
credentials: {}
# credentials:
#   hermes_http: "replace-with-hermes-http-secret"
#   hermes_a2a: "replace-with-hermes-a2a-secret"

max_inflight: 4096
max_per_caller: 1024
max_per_endpoint: 256
max_sessions: 100000
max_tasks: 100000
max_resources: 200000
max_resource_aliases: 200000
max_data_idempotency: 100000
